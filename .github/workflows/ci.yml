name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: dbt docs on the demo warehouse
        run: uv run f1pred demo && uv run f1pred --demo transform && uv run f1pred --demo docs
      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            transform/target/index.html
            transform/target/manifest.json
            transform/target/catalog.json
      - name: Model evaluation on the demo warehouse
        run: |
          uv run f1pred demo --seasons 2019-2026
          uv run f1pred --demo transform
          uv run f1pred --demo evaluate --quick
      - name: Upload model report
        uses: actions/upload-artifact@v4
        with:
          name: model-report-demo
          path: data/demo/reports/model
      - name: Replay a demo race with the saved models
        run: uv run f1pred --demo replay 202601 | tail -n 5

  docker:
    # The image a recruiter would run: build it, let it build the demo on first
    # start, then stream one replay over SSE.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t f1pred-hud .
      - name: Start it and wait for the models
        run: |
          docker run -d --name hud -p 8000:8000 f1pred-hud
          for i in $(seq 1 90); do
            if curl -sf localhost:8000/api/health | grep -q '"models_loaded":true'; then exit 0; fi
            sleep 10
          done
          docker logs hud
          exit 1
      - name: Stream a replay
        run: |
          curl -sf localhost:8000/ | grep -q EventSource
          race=$(curl -sf localhost:8000/api/races | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['race_id'])")
          updates=$(curl -sfN "localhost:8000/api/races/$race/stream?interval=0" | grep -c '^event: update')
          echo "Race $race: $updates updates"
          test "$updates" -gt 10
      - name: Container logs
        if: always()
        run: docker logs hud || true
