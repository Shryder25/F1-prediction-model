[project]
name = "f1pred"
version = "0.1.0"
description = "F1 data platform and lap-by-lap race outcome predictor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "fastf1>=3.9.0",
    "dagster>=1.13.27",
]

[project.scripts]
f1pred = "f1pred.cli:main"

[dependency-groups]
dashboard = [
    "plotly>=5.22",
    "streamlit>=1.38",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=3.7",
    "dagster-webserver>=1.13.27",
]
transform = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1pred"]

[tool.dagster]
module_name = "f1pred.orchestration.definitions"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Raised inside pandas by the installed NumPy for every Timedelta; not from this code.
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
